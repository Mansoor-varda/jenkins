<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JENKINS CI/CD Test</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #222;
            text-align: center;
        }

        header {
            background: #1f2937;
            color: white;
            padding: 25px;
        }

        header h1 {
            color: #38bdf8;
        }

        .hero {
            padding: 80px 20px;
        }

        .hero h2 {
            font-size: 42px;
            margin-bottom: 20px;
        }

        .hero p {
            font-size: 20px;
            color: #555;
        }

        .status {
            display: inline-block;
            margin-top: 30px;
            padding: 15px 30px;
            background: #16a34a;
            color: white;
            border-radius: 8px;
            font-weight: bold;
        }

        .info {
            margin: 30px auto;
            max-width: 600px;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        .info p {
            margin: 12px;
        }

        footer {
            margin-top: 50px;
            padding: 20px;
            background: #1f2937;
            color: white;
        }
    </style>
</head>

<body>

<header>
    <h1>Jenkins CI/CD Demo</h1>
</header>

<section class="hero">

    <h2>🚀 Deployment Successful!</h2>

    <p>
        This website is deployed automatically using Jenkins.
    </p>

    <div class="status">
        BUILD & DEPLOYMENT: SUCCESS
    </div>

</section>

<div class="info">

    <h2>CI/CD Pipeline</h2>

    <p><strong>Source:</strong> GitHub</p>

    <p><strong>CI/CD:</strong> Jenkins</p>

    <p><strong>Server:</strong> Amazon Linux</p>

    <p><strong>Web Server:</strong> Nginx</p>

    <p><strong>Trigger:</strong> GitHub Webhook</p>

</div>

<footer>
    Jenkins → GitHub → Amazon Linux → Nginx
</footer>

</body>
</html>
